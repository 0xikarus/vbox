openapi: 3.1.0
info:
  title: vmbox controller API
  version: v1alpha1
  description: Repository-neutral box, run, event, question, lifecycle, cost, quota, and notification contracts.
servers:
  - url: https://controller.example
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Healthy}
  /v1/runs:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
      responses:
        '202':
          description: Accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
        '200':
          description: Existing idempotent run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /v1/runs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200':
          description: Run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /v1/runs/{id}/events:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}
      responses: {'204': {description: Idempotently recorded}}
  /v1/questions:
    get:
      responses:
        '200':
          description: Open questions
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Question'}}}}
  /v1/questions/{id}/answer:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [answer], properties: {answer: {type: string, minLength: 1}}}}}
      responses: {'204': {description: Answer accepted exactly once}, '409': {description: Stale or already answered}}
  /v1/hosts/heartbeat:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id, capabilities], properties: {id: {type: string}, capabilities: {type: object}}}}}
      responses: {'204': {description: Capacity advertisement recorded}}
  /v1/users:
    get:
      description: Owner-only account member listing.
      responses: {'200': {description: Account users}}
    post:
      description: Owner-only user creation. The access token is returned once.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateUser'}}}
      responses: {'201': {description: User and one-time token created}, '403': {description: Owner role required}}
  /v1/users/{id}:
    delete:
      description: Owner-only user disable and token revocation. The last owner cannot be removed.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: User disabled}, '403': {description: Owner role required}}
  /v1/provider-credentials:
    get:
      description: Owner-only credential metadata listing; secret values are never returned.
      responses: {'200': {description: Provider credential metadata}}
  /v1/provider-credentials/{provider}/{name}:
    put:
      description: Owner-only encrypted create or rotation.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutSecret'}}}
      responses: {'200': {description: Credential metadata}}
    delete:
      description: Owner-only credential removal.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Credential removed}}
  /v1/notifications:
    get:
      description: Owner-only destination metadata listing; secrets are never returned.
      responses: {'200': {description: Notification destinations}}
  /v1/notifications/{kind}/{name}:
    put:
      description: Configure or rotate an encrypted webhook, Telegram, or Discord destination.
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [webhook, telegram, discord]}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutNotification'}}}
      responses: {'200': {description: Destination configured}}
    delete:
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Destination removed}}
  /v1/notifications/{kind}/{name}/test:
    post:
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Test delivered}, '502': {description: Delivery failed}}
  /v1/integrations/{kind}/{account}/{name}:
    post:
      security: []
      description: Provider-authenticated Telegram webhook or Discord interaction callback. External identities must be allowlisted and mapped to active controller users before they may answer a question.
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [telegram, discord]}}
        - {name: account, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Discord interaction response}
        '204': {description: Telegram update accepted}
        '400': {description: Invalid or unauthorized interaction payload}
        '401': {description: Invalid Telegram webhook secret}
  /v1/fleet/status:
    get:
      description: Fleet capacity and slot state for a provider and credential.
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses: {'200': {description: Fleet status, content: {application/json: {schema: {$ref: '#/components/schemas/FleetStatus'}}}}}
  /v1/fleet/slots:
    get:
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses: {'200': {description: Desired compute-slot configuration, content: {application/json: {schema: {$ref: '#/components/schemas/FleetConfig'}}}}}
    put:
      description: Owner-only update of desired reusable compute slots.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FleetConfig'}}}
      responses: {'200': {description: Fleet configuration accepted}}
  /v1/inventory:
    get:
      description: Combined inventory for one provider credential. All fleet slot services are omitted; occupied capacity is represented once by its logical box, and only non-fleet services appear as external.
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses:
        '200': {description: Sanitized inventory, content: {application/json: {schema: {$ref: '#/components/schemas/BoxInventory'}}}}
  /v1/logical-boxes/{id}/messages:
    post:
      description: Message a logical box directly. If it is offline, allocate compute and start the requested agent (Claude by default).
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectBoxMessage'}}}
      responses: {'202': {description: Existing agent messaged or a new agent start accepted}}
  /v1/chat-groups:
    get:
      description: List durable chat groups visible to the caller.
      responses: {'200': {description: Chat groups, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChatGroup'}}}}}}
    post:
      description: Create a durable group with two or more logical boxes.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutChatGroup'}}}
      responses: {'201': {description: Group created}}
  /v1/chat-groups/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Chat group}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutChatGroup'}}}
      responses: {'200': {description: Group updated}}
    delete:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Group deleted}}
  /v1/chat-groups/{id}/messages:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Durable group message history}}
    post:
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SendGroupMessage'}}}
      responses: {'202': {description: Message accepted for selected recipients}}
  /v1/logical-boxes:
    get:
      responses: {'200': {description: Account-scoped logical boxes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}}}}}
    post:
      description: Create a persistent volume-backed logical box independently from compute.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateLogicalBox'}}}
      responses: {'202': {description: Volume creation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Logical box, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}/allocate:
    post:
      description: Reserve a free slot or enqueue the logical box when the fleet is full.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {leaseOwner: {type: string}, leaseSeconds: {type: integer, minimum: 0}}}}}
      responses: {'202': {description: Reserved, attaching, or queued allocation}, '200': {description: Existing ready allocation}}
  /v1/logical-boxes/{id}/hibernate:
    post:
      description: Snapshot tmux, detach the retained volume, sanitize the service, and free its slot.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Hibernated logical box, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}/volume:
    delete:
      description: Permanently delete only this logical box volume; fleet capacity is unchanged.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [confirmation], properties: {confirmation: {type: string, description: Exact logical box name.}}}}}
      responses: {'204': {description: Volume deleted}, '409': {description: Confirmation or lifecycle conflict}}
  /v1/logical-boxes/{id}/connection:
    get:
      description: Owner-only fenced direct-SSH target for the current allocation.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: session, in: query, schema: {type: string, default: vmbox}}
      responses: {'200': {description: Validated connection, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBoxConnection'}}}}}
  /v1/logical-boxes/{id}/terminal:
    get:
      description: Read-only tmux screen mirror.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: session, in: query, schema: {type: string, default: vmbox}}
        - {name: history, in: query, schema: {type: integer, default: 200}}
      responses: {'200': {description: Terminal snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/TerminalSnapshot'}}}}}
  /v1/logical-boxes/{id}/terminal/input:
    post:
      description: Deliver exact text to tmux without ambiguous retry.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SendBoxMessage'}}}
      responses: {'204': {description: Input delivered}, '409': {description: Delivery is ambiguous or box is not running}}
  /v1/logical-boxes/{id}/tasks:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Tasks for the logical box, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BoxTask'}}}}}}
    post:
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBoxTask'}}}
      responses: {'202': {description: Task accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BoxTask'}}}}}
  /v1/tasks/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Box task, content: {application/json: {schema: {$ref: '#/components/schemas/BoxTask'}}}}}
  /v1/tasks/{id}/messages:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Task messages, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BoxMessage'}}}}}}
    post:
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SendBoxMessage'}}}
      responses: {'202': {description: Message accepted or delivered}}
  /v1/allocations/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Allocation status}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    ProviderQuery: {name: provider, in: query, required: true, schema: {type: string}}
    ProviderCredentialQuery: {name: providerCredential, in: query, schema: {type: string}}
  schemas:
    FleetConfig:
      type: object
      required: [provider, compute_box_slots]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        compute_box_slots: {type: integer, minimum: 0, maximum: 32, default: 4}
        updatedAt: {type: string, format: date-time}
    FleetStatus:
      type: object
      required: [provider, desiredSlots, actualSlots, freeSlots, occupiedSlots, slots, detachedLogicalBoxes]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        desiredSlots: {type: integer}
        actualSlots: {type: integer}
        freeSlots: {type: integer}
        occupiedSlots: {type: integer}
        startingSlots: {type: integer}
        drainingSlots: {type: integer}
        unhealthySlots: {type: integer}
        stoppedSlots: {type: integer}
        pendingAllocationRequests: {type: integer}
        slots: {type: array, items: {$ref: '#/components/schemas/ComputeSlot'}}
        detachedLogicalBoxes: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}
    ComputeSlot:
      type: object
      properties:
        id: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        ordinal: {type: integer}
        state: {enum: [starting, free, reserved, occupied, draining, unhealthy, stopped]}
        serviceId: {type: string}
        serviceName: {type: string}
        deploymentInstanceId: {type: string}
        logicalBoxId: {type: string}
        logicalBoxName: {type: string}
        assignmentGeneration: {type: integer, format: int64}
        failureReason: {type: string}
    CreateLogicalBox:
      type: object
      required: [name, provider]
      properties:
        name: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        region: {type: string}
        diskGiB: {type: integer, format: int64, default: 10}
        volumeId: {type: string, description: Owner-only import; must be paired with volumeName.}
        volumeName: {type: string, description: Owner-only import; must be paired with volumeId.}
        allocateWhenReady: {type: boolean}
        allocationIdempotencyKey: {type: string}
    LogicalBox:
      type: object
      required: [id, name, provider, state, volumeId, volumeName, assignmentGeneration]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        state: {enum: [detached, reserved, attaching, running, draining, hibernating, hibernated, deleting, failed]}
        volumeId: {type: string}
        volumeName: {type: string}
        slotId: {type: string}
        assignmentGeneration: {type: integer, format: int64}
        restorationState: {type: string}
        failureReason: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateBoxTask:
      type: object
      required: [agent, prompt]
      properties:
        agent: {enum: [codex, claude, opencode, shell]}
        prompt: {type: string, minLength: 1}
        session: {type: string, default: vmbox}
    BoxTask:
      type: object
      required: [id, logicalBoxId, boxName, userId, agent, session, prompt, state, createdAt, updatedAt]
      properties:
        id: {type: string}
        logicalBoxId: {type: string}
        boxName: {type: string}
        userId: {type: string}
        agent: {type: string}
        session: {type: string}
        prompt: {type: string}
        state: {enum: [queued, waiting_capacity, starting, active, failed]}
        failureReason: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SendBoxMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        submit: {type: boolean, default: true}
    BoxMessage:
      type: object
      properties:
        id: {type: string}
        taskId: {type: string}
        userId: {type: string}
        direction: {enum: [user_to_agent, agent_to_user]}
        text: {type: string}
        state: {enum: [queued, delivering, delivered, failed, ambiguous]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TerminalSnapshot:
      type: object
      properties:
        boxName: {type: string}
        session: {type: string}
        pane: {type: string}
        title: {type: string}
        command: {type: string}
        width: {type: integer}
        height: {type: integer}
        content: {type: string}
        capturedAt: {type: string, format: date-time}
    LogicalBoxConnection:
      type: object
      properties:
        logicalBoxId: {type: string}
        boxName: {type: string}
        session: {type: string}
        connection:
          type: object
          properties:
            transport: {enum: [openssh]}
            endpoint: {type: string}
            metadata: {type: object, additionalProperties: {type: string}}
    ConnectedBox:
      type: object
      required: [id, name, provider, state, management, chatCapable]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        state: {type: string}
        providerState: {type: string}
        region: {type: string}
        image: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
        storage: {type: object}
        management: {enum: [external]}
        chatCapable: {type: boolean, enum: [false]}
    BoxInventory:
      type: object
      required: [logicalBoxes, connectedBoxes]
      properties:
        logicalBoxes: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}
        connectedBoxes: {type: array, items: {$ref: '#/components/schemas/ConnectedBox'}}
    DirectBoxMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        agent: {enum: [claude, codex, opencode, shell], default: claude}
        session: {type: string, default: vmbox}
    ChatGroupMember:
      type: object
      required: [logicalBoxId]
      properties:
        logicalBoxId: {type: string}
        boxName: {type: string, readOnly: true}
        agent: {enum: [claude, codex, opencode, shell], default: claude}
        canReceive: {type: boolean, default: true}
    PutChatGroup:
      type: object
      required: [name, members]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        members: {type: array, minItems: 2, maxItems: 32, items: {$ref: '#/components/schemas/ChatGroupMember'}}
    ChatGroup:
      allOf:
        - {$ref: '#/components/schemas/PutChatGroup'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    SendGroupMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        recipientBoxIds: {type: array, items: {type: string}}
        sourceBoxId: {type: string, description: Optional group member whose output is being forwarded.}
    Resources:
      type: object
      properties:
        cpu: {type: number, exclusiveMinimum: 0}
        memoryMiB: {type: integer, minimum: 128}
        diskGiB: {type: integer, minimum: 1}
    Lifecycle:
      type: object
      properties:
        onSuccess: {enum: [delete, retain, stop], default: delete}
        onFailure: {enum: [delete, retain, stop], default: retain}
        maxTtl: {type: string, default: 8h}
        gracePeriod: {type: string, default: 5m}
    CreateRun:
      type: object
      required: [provider, command]
      properties:
        provider: {enum: [railway, docker, incus]}
        box: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
        region: {type: string}
        image: {type: string, description: OCI digest is recommended and recorded in box metadata.}
        components: {type: array, items: {type: string}}
        command:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
          description: Exact argv; no implicit shell interpolation.
        externalReference: {type: string}
        credentialReferences: {type: array, items: {type: string}, description: Opaque vault references, never secret values.}
        providerCredential: {type: string, description: Account-scoped encrypted provider credential name.}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        notificationPolicy: {type: string}
    Run:
      type: object
      required: [id, accountId, provider, state, request, createdAt, updatedAt]
      properties:
        id: {type: string}
        accountId: {type: string, format: uuid}
        boxId: {type: string}
        provider: {type: string}
        state: {enum: [queued, provisioning, preparing, running, needs_input, resuming, succeeded, failed, cancelled, cleaning_up, deleted, retained]}
        request: {$ref: '#/components/schemas/CreateRun'}
        exitCode: {type: integer}
        summary: {type: string}
        lastOutputAt: {type: string, format: date-time}
        lastHeartbeatAt: {type: string, format: date-time}
        lastActivity: {type: string, maxLength: 512}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [id, sequence, type, timestamp]
      properties:
        id: {type: string}
        sequence: {type: integer, minimum: 1}
        type: {enum: [state, output, heartbeat, progress, needs_input, resumed, success, failed, cleanup_requested]}
        state: {type: string}
        stream: {enum: [stdout, stderr]}
        message: {type: string, maxLength: 512}
        data: {type: object}
        timestamp: {type: string, format: date-time}
        signature: {type: string}
    Question:
      type: object
      required: [id, accountId, runId, prompt, state, blocking, askedAt]
      properties:
        id: {type: string}
        accountId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        prompt: {type: string}
        state: {enum: [open, answered, timed_out, cancelled]}
        blocking: {type: boolean}
        askedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        answer: {type: string}
        answeredBy: {type: string, format: uuid}
    CreateUser:
      type: object
      required: [subject, role]
      properties:
        subject: {type: string, minLength: 1}
        role: {enum: [owner, user]}
    PutSecret:
      type: object
      required: [secret]
      properties:
        secret: {type: object, writeOnly: true, minProperties: 1}
        config: {type: object, description: Non-secret provider configuration.}
    PutNotification:
      type: object
      required: [secret]
      properties:
        secret: {type: object, writeOnly: true, minProperties: 1}
        config: {type: object, description: Non-secret destination configuration.}
