openapi: 3.1.0
info:
  title: vbox controller API
  version: v1alpha2
  description: Repository-neutral box, run, event, question, lifecycle, cost, quota, and notification contracts.
servers:
  - url: https://controller.example
security:
  - bearerAuth: []
paths:
  /v1/chat-sidebar-layout:
    get:
      summary: Read the account's saved chat sidebar groups and conversation assignments
      responses:
        '200':
          description: Saved layout, or an empty layout with exists false before its first save
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSidebarLayout'}
    put:
      summary: Replace the account's saved chat sidebar layout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatSidebarLayout'}
      responses:
        '200':
          description: Saved layout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatSidebarLayout'}
        '400': {description: Invalid groups or conversation assignments}
  /v1/agent-desktop/box-configs:
    get:
      security: [{desktopAgentAuth: []}]
      summary: Agent-readable, non-secret creation options for a box with create_agent_box permission
      responses:
        '200':
          description: Allowed agent types and limits, saved profile metadata, assignable role IDs, and tool presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowedAgents: {type: array, items: {enum: [codex, claude, opencode]}}
                  maxBoxes: {type: integer}
                  maxDiskGiB: {type: integer}
                  loginProfiles: {type: array, items: {$ref: '#/components/schemas/LoginProfile'}}
                  assignableRoles: {type: array, items: {$ref: '#/components/schemas/AgentRoleSummary'}}
                  toolPresets: {type: array, items: {$ref: '#/components/schemas/ToolPreset'}}
        '403': {description: Creator lacks create_agent_box permission}
  /v1/agent-desktop/available-workers:
    get:
      security: [{desktopAgentAuth: []}]
      summary: Healthy free worker slots across the account's configured pools
      responses:
        '200':
          description: Worker slots eligible for explicit new-box placement at the time of the request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slotId: {type: string, format: uuid}
                    provider: {type: string}
                    providerCredential: {type: string}
                    serviceName: {type: string}
                    ordinal: {type: integer}
                    region: {type: string}
        '403': {description: Creator lacks create_agent_box permission}
  /v1/logical-boxes/{id}/run-budget-policy:
    get:
      summary: Owner view of a box's allocated-time limit and current countdown
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Configured seconds, remaining seconds, deadline, and state}
    put:
      summary: Set a box's allocated-time limit and restart its current countdown
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds]
              properties:
                seconds: {type: integer, minimum: 0, maximum: 2592000, description: Zero disables the limit; positive values must be at least 60 seconds}
      responses:
        '200': {description: Updated limit and restarted countdown}
  /v1/logical-boxes/{id}/run-budget-policy/adjust:
    post:
      summary: Reset or add time to a running box's current countdown without changing its saved limit
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedDeadlineAt]
              properties:
                action: {type: string, enum: [reset, add]}
                seconds: {type: integer, enum: [14400, 28800, 86400], description: Required for add; omit for reset}
                expectedDeadlineAt: {type: string, format: date-time, description: Deadline returned by the latest policy read; stale adjustments are rejected}
      responses:
        '200': {description: Updated countdown; the saved limit and elapsed current-run time are unchanged}
        '400': {description: Invalid action or duration}
        '409': {description: Box is not running, limit is off, cap reached, or deadline changed}
  /v1/agent-desktop/box-configs/{application}/{name}/models:
    get:
      security: [{desktopAgentAuth: []}]
      summary: Live model catalog for one creator-visible saved Claude, Codex or OpenCode profile
      parameters:
        - {in: path, name: application, required: true, schema: {enum: [claude, codex, opencode]}}
        - {in: path, name: name, required: true, schema: {type: string}}
      responses:
        '200': {description: Model IDs and available reasoning levels; no credentials}
        '403': {description: Creator lacks create_agent_box permission}
        '404': {description: Profile unavailable to this creator}
  /v1/agent-desktop/boxes:
    post:
      security: [{desktopAgentAuth: []}]
      summary: Create an agent box using the creator's bounded grant
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agent]
              properties:
                name: {type: string}
                agent: {enum: [codex, claude, opencode]}
                diskGiB: {type: integer, default: 10}
                tools: {type: array, uniqueItems: true, maxItems: 4, items: {enum: [foundry, blender, desktop, tor-socks5, cloudflare-warp]}}
                slotId: {type: string, format: uuid, description: Exact available worker slot and pool; omission prefers the creator's pool then tries other pools}
                instructions: {type: string, maxLength: 65536}
                loginProfiles: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/LoginProfileRef'}}
                task: {$ref: "#/components/schemas/AgentGoalTaskOptions"}
                roleIds: {type: array, maxItems: 8, items: {type: string, format: uuid}}
      responses:
        '202': {description: Box creation accepted}
        '403': {description: Agent type, role, disk size, or creation count is outside the creator grant}
        '409': {description: Selected worker or profile unavailable, or creation conflicts}
  /v1/agent-desktop/boxes/{box}/screenshot:
    get:
      security: [{desktopAgentAuth: []}]
      summary: Capture another running, unprotected agent box's desktop as a PNG
      description: Requires the screenshot MCP tool and box inspection permission. Does not wake the target or grant desktop control.
      parameters:
        - {in: path, name: box, required: true, schema: {type: string}, description: Exact box name or ID}
        - {in: query, name: thumbnail, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Current screenshot, content: {image/png: {schema: {type: string, format: binary}}}}
        '403': {description: Permission denied, target is protected, or target is the calling box}
        '404': {description: Box unavailable}
        '409': {description: Target desktop is offline or its assignment changed}
  /v1/agent-desktop/boxes/{box}/run-budget:
    put:
      security: [{desktopAgentAuth: []}]
      summary: Set another unprotected box's run-time budget and restart its countdown
      description: Requires the set_agent_box_run_budget MCP tool and box management restart permission. The configured limit survives hibernation. Zero disables this limit, independently of desktop inactivity.
      parameters:
        - {in: path, name: box, required: true, schema: {type: string}, description: Exact box name or ID}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seconds, confirmation]
              properties:
                seconds: {type: integer, minimum: 0, maximum: 2592000, description: Zero or at least 60 seconds}
                confirmation: {type: string, description: Exact target box name}
      responses:
        '200': {description: Target box and updated run-time budget}
        '400': {description: Invalid limit or missing confirmation}
        '403': {description: Permission denied}
        '404': {description: Box unavailable}
        '409': {description: Target is protected, is the caller, or confirmation differs}
  /v1/locations:
    get:
      summary: Available location presets from the controller-managed fleet
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses:
        '200':
          description: Region IDs and healthy free slot counts; no latency estimate
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    availableSlots: {type: integer}
  /v1/login-profiles:
    get:
      summary: Owner-only account login profile metadata; never credential contents
      responses:
        '200':
          description: Saved profiles
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LoginProfile'}}
  /v1/browser-profiles:
    get:
      summary: Owner-only reusable browser profile metadata; never cookie or storage values
      responses:
        '200': {description: Saved browser profiles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BrowserProfile'}}}}}
  /v1/browser-profiles/{name}:
    parameters: [{in: path, name: name, required: true, schema: {type: string}}]
    put:
      summary: Save or explicitly replace a Chromium session export encrypted for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceBrowser, sourcePath, state]
              properties:
                sourceBrowser: {enum: [chrome, chromium]}
                sourcePath: {type: string, description: Owner-visible local source path}
                state: {type: object, description: Private version 1 or 2 browser state}
                replaceExisting: {type: boolean, default: false}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserProfile'}}}}
        '200': {description: Replaced, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserProfile'}}}}
        '409': {description: Name already saved}
    delete:
      summary: Delete the reusable source; existing box imports remain
      responses:
        '204': {description: Deleted}
  /v1/logical-boxes/{id}/browser/profiles/{name}/attach:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
      - {in: path, name: name, required: true, schema: {type: string}}
    post:
      summary: Copy a saved browser profile into one box's pending imports without waking it
      responses:
        '201': {description: Per-box import ID, origins and pending status}
  /v1/profile-usage:
    get:
      summary: Owner-only cached usage limits for every saved agent profile
      description: Reads cached results without waking a box. The controller polls each account, application, and saved profile about every 30 minutes, preferring an available live box and otherwise checking the saved credential snapshot.
      responses:
        '200':
          description: Saved profile names, live box names, last observation, probe source, and normalized provider limits
          content:
            application/json:
              schema:
                type: object
                required: [profiles, refreshSeconds, pollSeconds]
                properties:
                  refreshSeconds: {type: integer}
                  pollSeconds: {type: integer}
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [application, name, boxes]
                      properties:
                        application: {type: string, enum: [claude, codex, opencode]}
                        name: {type: string}
                        boxes: {type: array, items: {type: string}}
                        checkedAt: {type: string, format: date-time}
                        observedAt: {type: string, format: date-time}
                        error: {type: string}
                        snapshot:
                          type: object
                          properties:
                            windows: {type: array, items: {type: object}}
                            spend: {type: object}
                            balances: {type: array, items: {type: object}}
                            rateCaps: {type: array, items: {type: object}}
                            note: {type: string}
        '403': {description: Owner role required}
  /v1/profile-usage/refresh:
    post:
      summary: Request an immediate usage check for every saved agent profile owned by the account
      description: Starts checks in the background and returns immediately. Active checks are deduplicated. Read GET /v1/profile-usage for progress and results; no sleeping box is started.
      responses:
        '202':
          description: Usage checks accepted
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles: {type: integer, description: Number of saved profiles selected for checking}
        '403': {description: Owner role required}
  /v1/login-profiles/{application}/{name}:
    parameters:
      - {in: path, name: application, required: true, schema: {enum: [claude, codex, opencode, github]}}
      - {in: path, name: name, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9@+_.:() -]{0,127}$'}}
    put:
      summary: Owner-only encrypted account profile creation or explicit replacement
      description: Maximum 512 KiB decoded. Set replaceExisting to true to replace only the saved profile with this exact name; existing boxes keep their imported credential copy. Codex accepts auth.json and config.toml. Claude accepts .credentials.json, settings.json and .claude.json. OpenCode accepts auth.json plus optional opencode.json or opencode.jsonc. GitHub accepts the controller's portable credential object. No plaintext export endpoint exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: object
                  minProperties: 1
                  additionalProperties: {type: string, contentEncoding: base64}
                replaceExisting: {type: boolean, default: false}
      responses:
        '201':
          description: Saved metadata
          content: {application/json: {schema: {$ref: '#/components/schemas/LoginProfile'}}}
        '200':
          description: Replaced saved profile metadata
          content: {application/json: {schema: {$ref: '#/components/schemas/LoginProfile'}}}
        '400': {description: Invalid name, application, file or size}
        '409': {description: Name already exists without replacement, replacement target is missing, duplicate content under another name, or storage/encryption unavailable}
  /v1/login-profiles/{application}/{name}/models:
    parameters:
      - {in: path, name: application, required: true, schema: {enum: [claude, codex, opencode]}}
      - {in: path, name: name, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9@+_.:() -]{0,127}$'}}
    get:
      summary: Load models available to the selected saved profile
      description: Claude queries Anthropic's Models API with the saved OAuth access token; model access is checked by Claude Code when used. Codex uses the saved login only through an isolated Codex app-server model/list request. OpenCode queries the saved OpenRouter or Venice provider key. Credential contents are never returned.
      responses:
        '200': {description: Model IDs, labels and supported reasoning choices}
        '400': {description: Profile type has no supported live catalog}
        '404': {description: Profile not found}
        '502': {description: Model catalog unavailable; the saved model remains selectable}
  /v1/agent-cli-versions:
    get:
      summary: Get account defaults for new-box agent CLI versions
      description: Owner-only. Empty values use the worker image's bundled CLI; latest resolves at each new box's creation.
      responses:
        '200': {description: Claude Code, Codex CLI and OpenCode version defaults}
        '403': {description: Owner role required}
    put:
      summary: Set account defaults for new-box agent CLI versions
      description: Owner-only. Exact release versions or the npm latest tag are resolved to an exact release before a new box reserves a slot and installed into its persistent home. Existing boxes are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claude, codex, opencode]
              properties:
                claude: {type: string, description: Exact Claude Code version, latest, or empty for image version}
                codex: {type: string, description: Exact Codex CLI version, latest, or empty for image version}
                opencode: {type: string, description: Exact OpenCode version, latest, or empty for image version}
      responses:
        '200': {description: Saved version defaults}
        '400': {description: Invalid version}
        '403': {description: Owner role required}
        '502': {description: npm registry unavailable; settings were not changed}
  /v1/agent-cli-versions/catalog/{agent}:
    get:
      summary: List published npm releases for an agent CLI
      description: Owner-only. Returns the current npm latest tag and published exact versions for the selected harness.
      parameters:
        - {in: path, name: agent, required: true, schema: {enum: [claude, codex, opencode]}}
      responses:
        '200': {description: Agent name, latest release, and exact versions}
        '400': {description: Unsupported agent}
        '403': {description: Owner role required}
        '502': {description: npm registry unavailable}
  /v1/ai/openrouter:
    get:
      summary: Read AI writing helper configuration
      description: Owner-only. Returns whether a dedicated OpenRouter key is configured and its model ID; never returns the key.
      responses:
        '200': {description: Configuration status without secret material}
        '403': {description: Owner role required}
    put:
      summary: Save an OpenRouter key for the AI writing helper
      description: Owner-only. Encrypts the account-wide key on the controller. This key takes precedence over a saved OpenCode OpenRouter profile. Omit the key to change only the model when a key is already saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string, minLength: 8, maxLength: 512}
                model: {type: string, default: openrouter/auto}
      responses:
        '200': {description: Configuration status without secret material}
        '400': {description: Invalid key or model}
        '403': {description: Owner role required}
    delete:
      summary: Remove the dedicated AI writing helper key
      description: Owner-only. A saved OpenCode OpenRouter profile can still be used as a fallback.
      responses:
        '204': {description: Key removed}
        '403': {description: Owner role required}
  /v1/ai/rewrite:
    post:
      summary: Rewrite a browser draft with OpenRouter
      description: Owner-only. Uses the dedicated encrypted OpenRouter key when configured, otherwise the first saved OpenCode profile whose selected model is on OpenRouter. The API key remains on the controller. Returns a suggestion for review; it never sends a chat message or saves an instruction preset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, text]
              properties:
                kind: {type: string, enum: [chat, markdown]}
                text: {type: string, maxLength: 65536}
                instruction: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Revised text
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: {type: string}
        '400': {description: Invalid draft or instruction}
        '403': {description: Owner role required}
        '422': {description: No usable OpenRouter key or saved profile}
        '502': {description: OpenRouter could not complete the rewrite}
  /v1/logical-boxes/{id}/process-tasks:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      summary: Submit one-shot execution; agent tracks its own work
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, prompt]
              properties:
                agent: {type: string, enum: [codex, claude, opencode, shell]}
                prompt: {type: string, minLength: 1, maxLength: 100000}
                session: {type: string}
      responses:
        '202': {description: Queued process task}
        '200': {description: Existing identical idempotent request}
        '409': {description: Conflicting request}
    get:
      summary: List one-shot execution metadata without waking compute
      responses: {'200': {description: Process task list}}
  /v1/process-tasks/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      summary: Cached process state, timestamps, nullable exitCode, signal and outputTruncated
      responses: {'200': {description: Execution metadata; exited does not prove semantic task completion}, '404': {description: Task inaccessible or not found}}
  /v1/process-tasks/{id}/output:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      summary: Cached combined output (first 1 MiB) and truncation flag, without waking compute
      responses: {'200': {description: Object with taskId, output and truncated}, '404': {description: Task inaccessible or not found}}
  /v1/logical-boxes/{id}/sessions/interactive:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      summary: Owner-only persistent interactive session; serialized against auto-hibernation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: {type: string, enum: [codex, claude, opencode, shell]}
                reuseShell: {type: boolean, default: false, description: Reuse the remembered shell or create it if missing. Requires agent shell and no startCli.}
                reuseExisting: {type: boolean, default: false, description: "Reuse an existing interactive terminal regardless of agent, preferring the remembered primary. Excludes task and internal runtime sessions. Starts the requested agent only when no interactive terminal exists. Cannot be combined with startCli."}
                startCli: {type: string, maxLength: 16384, description: Optional command to run once in a new shell before returning to the login shell. Requires agent shell; maximum 16 KiB and no NUL.}
      responses: {'200': {description: Object containing exact reused shell session name}, '201': {description: Object containing exact created session name}, '400': {description: Invalid agent or startup/reuse options}, '409': {description: Box assignment changed}, '502': {description: Inventory or startup unconfirmed; inspect sessions before retrying}}
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Healthy}
  /v1/runs:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
      responses:
        '202':
          description: Accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
        '200':
          description: Existing idempotent run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /v1/runs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200':
          description: Run
          content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}
  /v1/runs/{id}/events:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}
      responses: {'204': {description: Idempotently recorded}}
  /v1/questions:
    get:
      responses:
        '200':
          description: Open questions
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Question'}}}}
  /v1/questions/{id}/answer:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [answer], properties: {answer: {type: string, minLength: 1}}}}}
      responses: {'204': {description: Answer accepted exactly once}, '409': {description: Stale or already answered}}
  /v1/hosts/heartbeat:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id, capabilities], properties: {id: {type: string}, capabilities: {type: object}}}}}
      responses: {'204': {description: Capacity advertisement recorded}}
  /v1/users:
    get:
      description: Owner-only account member listing.
      responses: {'200': {description: Account users}}
    post:
      description: Owner-only user creation. The access token is returned once.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateUser'}}}
      responses: {'201': {description: User and one-time token created}, '403': {description: Owner role required}}
  /v1/users/{id}:
    delete:
      description: Owner-only user disable and token revocation. The last owner cannot be removed.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: User disabled}, '403': {description: Owner role required}}
  /v1/provider-credentials:
    get:
      description: Owner-only credential metadata listing; secret values are never returned.
      responses: {'200': {description: Provider credential metadata}}
  /v1/provider-credentials/{provider}/{name}:
    get:
      description: Owner-only public metadata. Secret values are never returned.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Metadata with updatedAt revision}}
    patch:
      description: Owner-only partial image edit or explicit secret replacement. Target fields immutable. Null deletes image. Omitted secret preserved.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config: {type: object, additionalProperties: true}
                secret: {type: object, writeOnly: true}
                replaceSecret: {type: boolean}
      responses: {'200': {description: Public metadata}, '409': {description: Missing or stale revision or forbidden target edit}}
    put:
      description: Owner-only encrypted create. Existing aliases cannot be replaced by legacy PUT.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutSecret'}}}
      responses: {'200': {description: Credential metadata}}
    delete:
      description: Removal is blocked pending explicit resource and default migration.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'409': {description: Migration required; credential retained}}
  /v1/notifications:
    get:
      description: Owner-only destination metadata listing; secrets are never returned.
      responses: {'200': {description: Notification destinations}}
  /v1/notifications/{kind}/{name}:
    put:
      description: Configure or rotate an encrypted webhook or Discord destination.
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [webhook, discord]}}
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutNotification'}}}
      responses: {'200': {description: Destination configured}}
    delete:
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Destination removed}}
  /v1/notifications/{kind}/{name}/test:
    post:
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'204': {description: Test delivered}, '502': {description: Delivery failed}}
  /v1/integrations/{kind}/{account}/{name}:
    post:
      security: []
      description: Provider-authenticated Discord interaction callback. External identities must be allowlisted and mapped to active controller users before they may answer a question.
      parameters:
        - {name: kind, in: path, required: true, schema: {enum: [discord]}}
        - {name: account, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Discord interaction response}
        '400': {description: Invalid or unauthorized interaction payload}
  /v1/fleet/status:
    get:
      description: Fleet capacity and slot state for a provider and credential.
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses: {'200': {description: Fleet status, content: {application/json: {schema: {$ref: '#/components/schemas/FleetStatus'}}}}}
  /v1/fleet/slots:
    get:
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses: {'200': {description: Desired compute-slot configuration, content: {application/json: {schema: {$ref: '#/components/schemas/FleetConfig'}}}}}
    put:
      description: Owner-only update of desired reusable compute slots. For a shared worker that supports remote settings, a positive count also sets the worker's own slot capacity (see /v1/fleet/worker).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FleetConfig'}}}
      responses: {'200': {description: Fleet configuration accepted}}
  /v1/fleet/worker:
    get:
      description: A worker pool's remotely editable settings, the machine specs that bound them, and the controller's desired slot count. Pools whose provider has no configurable worker report supported=false with a reason.
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses: {'200': {description: Worker pool settings, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerPool'}}}}}
    put:
      description: >-
        Owner-only. Sets one slot count for the worker and the fleet together, plus the default size of new boxes, without
        restarting the worker. Values are bounded by the worker's machine; memory overcommit across slots is allowed and
        reported. Lowering retires free slots first and never evicts occupied ones. Requires the current settings revision.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SetWorkerPool'}}}
      responses:
        '200': {description: Settings applied, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerPool'}}}}
        '400': {description: Outside the machine's limits or below the boxes on the worker}
        '409': {description: Stale revision or the provider has no configurable worker}
  /v1/inventory:
    get:
      description: Combined inventory for one provider credential. All fleet slot services are omitted; occupied capacity is represented once by its logical box, and only non-fleet services appear as external.
      parameters:
        - {$ref: '#/components/parameters/ProviderQuery'}
        - {$ref: '#/components/parameters/ProviderCredentialQuery'}
      responses:
        '200': {description: Sanitized inventory, content: {application/json: {schema: {$ref: '#/components/schemas/BoxInventory'}}}}
  /v1/logical-boxes/{id}/messages:
    post:
      description: Message a logical box directly. If it is offline, allocate compute and start the requested agent (Claude by default).
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectBoxMessage'}}}
      responses: {'202': {description: Existing agent messaged or a new agent start accepted}}
  /v1/chat-groups:
    get:
      description: List durable chat groups visible to the caller.
      responses: {'200': {description: Chat groups, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChatGroup'}}}}}}
    post:
      description: Create a durable group with two or more logical boxes.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutChatGroup'}}}
      responses: {'201': {description: Group created}}
  /v1/chat-groups/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Chat group}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PutChatGroup'}}}
      responses: {'200': {description: Group updated}}
    delete:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Group deleted}}
  /v1/chat-groups/{id}/messages:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Durable group message history}}
    post:
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SendGroupMessage'}}}
      responses: {'202': {description: Message accepted for selected recipients}}
  /v1/logical-boxes:
    get:
      responses: {'200': {description: Account-scoped logical boxes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}}}}}
    post:
      description: Create a persistent volume-backed logical box independently from compute.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateLogicalBox'}}}
      responses: {'202': {description: Volume creation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Logical box, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}/imported-credentials:
    get:
      summary: Owner-only imported agent and GitHub credential references
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Current and queued references, content: {application/json: {schema: {$ref: '#/components/schemas/BoxLoginProfiles'}}}}
  /v1/logical-boxes/{id}/login-profiles:
    put:
      summary: Replace a box's full imported credential reference list
      description: Include the unchanged slot when changing or removing the other. An empty list clears both portable credential slots. Running boxes apply changed slots immediately; hibernated or detached boxes queue the full selection for their next start.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profiles]
              properties:
                profiles: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/LoginProfileRef'}}
      responses:
        '200': {description: Applied or queued references, content: {application/json: {schema: {$ref: '#/components/schemas/BoxLoginProfiles'}}}}
        '400': {description: Invalid or unavailable selected profile}
        '409': {description: Box transition or credential transfer conflict}
  /v1/agent-roles:
    get:
      description: Owner-only account role definitions and affected-box counts.
      responses: {'200': {description: Native roles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentRole'}}}}}}
    post:
      description: Create an account-scoped native role. Names have no built-in meaning.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PutAgentRole'}}}}
      responses: {'201': {description: Role created}}
  /v1/agent-roles/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Native role}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PutAgentRole'}}}}
      responses: {'200': {description: Role updated}}
    delete:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Role, assignments, and grants deleted}}
  /v1/agent-role-assignments:
    put:
      description: Validate and atomically replace role assignments for the listed boxes.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PutRoleAssignments'}}}}
      responses: {'204': {description: Assignments saved}, '409': {description: Cross-account or invalid reference}}
  /v1/logical-boxes/{id}/contacts:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Direct-contact choices and effective access after All contacts and protection are applied}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PutContactOverride'}}}}
      responses: {'200': {description: Updated effective contact access}}
  /v1/logical-boxes/{id}/tags:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Plain metadata labels for the box}}
    put:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tags], properties: {tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 32}}}}}}}
      responses: {'200': {description: Labels replaced}}
  /v1/logical-boxes/{id}/allocate:
    post:
      description: Reserve a free slot or enqueue the box. A failed attach timeout can be retried on its original fenced slot after the provider verifies the attached volume.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {leaseOwner: {type: string}, leaseSeconds: {type: integer, minimum: 0}}}}}
      responses: {'202': {description: Reserved, attaching, or queued allocation}, '200': {description: Existing ready allocation}}
  /v1/logical-boxes/{id}/hibernate:
    post:
      description: Snapshot tmux, detach the retained volume, sanitize the service, and free its slot.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Hibernated logical box, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBox'}}}}}
  /v1/logical-boxes/{id}/volume:
  /v1/logical-boxes/{id}/idle-policy:
    get:
      summary: Read a box's automatic hibernation policy
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Active timeout in seconds and last enabled timeout in resumeSeconds}
    put:
      summary: Set a box's automatic hibernation policy
      description: Owner-only. Set seconds to zero to turn automatic hibernation off; resumeSeconds preserves the previous interval for later use.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [seconds], properties: {seconds: {type: integer, minimum: 0, maximum: 604800}}}}}
      responses:
        '200': {description: Saved seconds and resumeSeconds}
        '400': {description: Enabled timeouts must be at least 60 seconds}
        '403': {description: Owner role required}
  /v1/logical-boxes/{id}/volume:
    delete:
      description: Queue permanent deletion of this exact logical box volume. Processing survives client disconnects and is resumed after controller restart; inspect box state, restorationState and failureReason for progress. Fleet capacity is unchanged.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [confirmation], properties: {confirmation: {type: string, description: Exact logical box name.}}}}}
      responses: {'202': {description: Durable deletion accepted; not yet complete}, '409': {description: Confirmation or lifecycle conflict}}
  /v1/logical-boxes/{id}/connection:
    get:
      description: Owner-only fenced direct-SSH target for the current allocation.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: session, in: query, schema: {type: string, default: vmbox}}
      responses: {'200': {description: Validated connection, content: {application/json: {schema: {$ref: '#/components/schemas/LogicalBoxConnection'}}}}}
  /v1/logical-boxes/{id}/terminal:
    get:
      description: Read-only tmux screen mirror.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: session, in: query, schema: {type: string, default: vmbox}}
        - {name: history, in: query, schema: {type: integer, default: 200}}
      responses: {'200': {description: Terminal snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/TerminalSnapshot'}}}}}
  /v1/logical-boxes/{id}/terminal/input:
    post:
      description: Deliver exact text to tmux without ambiguous retry.
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SendBoxMessage'}}}
      responses: {'204': {description: Input delivered}, '409': {description: Delivery is ambiguous or box is not running}}
  /v1/allocations/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Allocation status}}
  /v1/capabilities:
    get:
      description: Authenticated feature flags, permission-scoped. Check nativeAttach before allocating for attachment.
      responses: {'200': {description: Boolean nativeSessions, nativeAttach, snapshotUpdates, providerEdits}}
  /v1/controller-defaults:
    get:
      responses: {'200': {description: Provider and providerCredential. inferred is true when the sole configured credential is used without a saved default.}, '409': {description: Choose a default provider when no credential or several credentials exist without a saved default.}}
    put:
      description: Owner-only initial alias selection. A differing established default fails closed.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [provider, providerCredential], properties: {provider: {type: string}, providerCredential: {type: string}}}}}
      responses: {'200': {description: Default selected}, '409': {description: Missing alias or explicit migration required}}
  /v1/provider-schemas:
    get:
      responses: {'200': {description: Owner-only provider configuration field schemas and mutation rules}}
  /v1/provider-credentials/{provider}/{name}/validate:
    post:
      description: Owner-only bounded read inventory probe; does not claim create/delete/SSH permissions.
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: name, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Checked and unchecked capabilities}, '422': {description: Redacted validation failure}}
  /v1/logical-boxes/{id}/sessions:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      description: Real runtime IDs, exact names, assignment-bound incarnations, pane counts and fingerprints. 64 sessions/128 panes; caps marked partial. Offline reads never allocate.
      responses: {'200': {description: SessionInventory}, '502': {description: Observation unknown; not task completion}}
  /v1/logical-boxes/{id}/status:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      description: Logical box, historical tasks, and cached session observations with timestamps; explicitly stale or unknown. No provider probe or allocation.
      responses: {'200': {description: LogicalBox plus tasks, sessions and observationState}, '404': {description: Box not found in caller scope}}
  /v1/logical-boxes/{id}/sessions/primary:
    get:
      summary: Read the controller-persisted primary session name (owner only)
      responses:
        '200':
          description: Object with session string; empty when unset
    put:
      summary: Remember an exact live session as primary (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, incarnation]
              properties:
                sessionId: {type: string}
                incarnation: {type: string}
      responses:
        '200':
          description: Primary session name saved without changing other box metadata
        '409':
          description: Session or box assignment changed; select again
  /v1/logical-boxes/{id}/sessions/enable:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      description: Explicit owner-only migration of a running box; stages runtime and binds existing tmux server under assignment lock without restarting compute.
      responses: {'200': {description: Enabled}, '409': {description: Assignment unavailable}, '502': {description: Runtime migration failed}}
  /v1/logical-boxes/{id}/sessions/welcome:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      description: Owner-only welcome creation, separate from attach. Fails if sessions already exist.
      responses: {'200': {description: SessionInventory}, '409': {description: Refresh inventory}}
  /v1/logical-boxes/{id}/native-connection:
    get:
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: sessionId, in: query, required: true, schema: {type: string}}
        - {name: incarnation, in: query, required: true, schema: {type: string}}
      description: Owner-only structured OpenSSH handoff; assignment fence is rechecked inside tmux immediately before exact-ID attach. No create/replace or arbitrary local command.
      responses: {'200': {description: Connection, logicalBoxId, sessionId, incarnation and assignment}, '409': {description: Stale assignment or session}, '502': {description: Transport unavailable}}
  /v1/logical-boxes/{id}/updates:
    get:
      parameters: [{$ref: '#/components/parameters/ID'}]
      description: On-demand bounded observations and up to 256 unacknowledged metadata revisions. No transcripts, implicit ack, wake, or agent completion claims.
      responses: {'200': {description: Inventory, updates, and coverage limits}, '502': {description: Observation unknown}}
  /v1/logical-boxes/{id}/updates/ack:
    post:
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [session, revision], properties: {session: {type: string}, revision: {type: string}}}}}
      responses: {'200': {description: Exact revision acknowledged for authenticated user}, '409': {description: Stale, foreign or unknown revision; nothing newer acknowledged}}
  /v1/tasks/profiles:
    get:
      summary: List permitted task login profiles using random IDs and anonymous labels
      responses:
        '200': {description: No saved names, email addresses or credentials, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TaskProfile'}}}}}
        '401': {description: Invalid owner, user or task service authentication}
  /v1/task-profiles:
    get:
      summary: List reusable task configurations permitted by the caller's login-profile grants
      responses:
        '200': {description: Available task presets, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GoalTaskProfile'}}}}}
    post:
      summary: Owner creates a reusable task configuration without creating a box
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveGoalTaskProfile'}}}
      responses:
        '201': {description: Profile saved, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTaskProfile'}}}}
        '400': {description: Invalid configuration or login selection}
        '403': {description: Owner access required}
        '409': {description: Profile name already exists}
  /v1/task-profiles/{profile}:
    parameters:
      - {name: profile, in: path, required: true, schema: {type: string}, description: Account-scoped task profile name or ID}
    get:
      summary: Read a permitted task configuration
      responses:
        '200': {description: Task profile, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTaskProfile'}}}}
        '404': {description: Missing or unauthorized profile}
    put:
      summary: Owner replaces configuration for future tasks; name cannot change
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveGoalTaskProfile'}}}
      responses:
        '200': {description: Profile updated, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTaskProfile'}}}}
        '400': {description: Invalid settings or changed name}
        '404': {description: Profile not found}
    delete:
      summary: Owner deletes a profile; existing task snapshots are unaffected
      responses:
        '204': {description: Profile deleted}
        '404': {description: Profile not found}
  /v1/tasks:
    post:
      summary: Queue a disposable single-goal task
      description: Account-wide limit of four live task boxes. Queued tasks have no workspace volume. Service tokens can create only their own tasks with permitted profiles.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateGoalTask'}}}
      responses:
        '201': {description: Queued task; Idempotency-Replayed true for a replay, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTask'}}}}
        '400': {description: Invalid resources, profile selection or request}
        '403': {description: Permission denied}
        '409': {description: Idempotency key reused with different parameters}
    get:
      summary: List retained tasks visible to this creator (all account tasks for owners)
      parameters:
        - {name: state, in: query, description: Exact task state or current/history group, schema: {type: string}}
        - {name: creator, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Page of tasks, content: {application/json: {schema: {type: object, properties: {tasks: {type: array, items: {$ref: '#/components/schemas/GoalTask'}}, nextCursor: {type: string}}}}}}
  /v1/tasks/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Immediately read current task state and result (poll every 30 seconds)
      responses:
        '200': {description: Current task, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTask'}}}}
        '404': {description: Missing, deleted or outside caller scope}
    delete:
      summary: Delete a finished task, workspace and results through durable cleanup
      responses:
        '202': {description: Cleanup queued}
        '409': {description: Cancel the active task first}
  /v1/tasks/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      summary: Cancel queued or live work and release its workspace
      responses:
        '200': {description: Cancelled task, content: {application/json: {schema: {$ref: '#/components/schemas/GoalTask'}}}}
        '409': {description: Task has another terminal outcome}
  /v1/tasks/{id}/box:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      summary: Delete a finished task workspace early, retaining results until deleteAt
      responses:
        '202': {description: Workspace cleanup queued}
        '409': {description: Task is still active}
  /v1/tasks/{id}/messages:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Read live or saved task chat transcript
      responses:
        '200': {description: Ordered messages with id, direction, text, createdAt and state}
    post:
      summary: Send a message to a running task without waking finished tasks
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 20000}}}}}
      responses:
        '202': {description: Message queued}
        '409': {description: Task is not running or key conflicts}
  /v1/tasks/{id}/events:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Task lifecycle timeline
      parameters: [{name: after, in: query, schema: {type: integer, minimum: 0}}]
      responses:
        '200': {description: Up to 100 events plus after cursor; event fields id, kind, text, createdAt}
  /v1/tasks/{id}/files/{fileId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: fileId, in: path, required: true, schema: {type: string}}
    get:
      summary: Download an uploaded task result file
      responses:
        '200': {description: Attachment, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {description: File or task unavailable}
  /v1/tasks/{id}/final-screenshot:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Download the desktop captured at task finish
      responses:
        '200': {description: PNG with X-Vbox-Captured-At, content: {image/png: {schema: {type: string, format: binary}}}}
        '409': {description: Final capture unavailable}
  /v1/tasks/{id}/final-terminal:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Download terminal text captured at task finish
      responses:
        '200': {description: Terminal text, content: {text/plain: {schema: {type: string}}}}
        '409': {description: Final capture unavailable}
  /v1/tasks/{id}/links:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      summary: Mint task-scoped capability links; raw URLs returned once
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaskLinkRequest'}}}
      responses:
        '201': {description: Links, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TaskLink'}}}}}
        '403': {description: Control capability required}
    delete:
      summary: Revoke all task links or one selected link
      parameters: [{name: id, in: query, schema: {type: string}}]
      responses:
        '204': {description: Links revoked; streams close on revalidation}
  /v1/task-service-credentials:
    get:
      summary: Owner-only service credential metadata (never raw tokens)
      responses:
        '200': {description: Credentials with profileIds, allowControl, expiresAt and revokedAt}
    post:
      summary: Owner creates a scoped service token, returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                profileIds: {type: array, items: {type: string}}
                allowControl: {type: boolean, default: false}
                expiresAt: {type: string, format: date-time}
      responses:
        '201': {description: Credential metadata and one-time raw token}
        '403': {description: Owner permission required}
  /v1/task-service-credentials/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      summary: Owner revokes a task service token
      responses:
        '204': {description: Token revoked}
  /v1/task-service-credentials/profiles:
    get:
      summary: Owner-only mapping of anonymous task profile IDs to saved names
      responses:
        '200': {description: id, application, label and name; service credentials are not accepted}
  /v1/agent-desktop/task/complete:
    post:
      security: [{desktopAgentAuth: []}]
      summary: Task agent records its immutable result and uploaded workspace files
      responses:
        '200': {description: Finished task resource}
        '404': {description: This box is not a task}
  /v1/agent-desktop/task/fail:
    post:
      security: [{desktopAgentAuth: []}]
      summary: Task agent records why its goal cannot be completed
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [message], properties: {message: {type: string, minLength: 1, maxLength: 20000}}}}}
      responses:
        '200': {description: Finished task resource}
        '404': {description: This box is not a task}
  /v1/task-links/{token}/screenshot.png:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    get:
      security: []
      summary: Capability-scoped live or final desktop; never wakes a task
      parameters: [{name: source, in: query, schema: {enum: [desktop, terminal]}}]
      responses:
        '200': {description: PNG, or terminal text when source=terminal}
        '404': {description: Link unavailable}
        '409': {description: Capture unavailable}
  /v1/logical-boxes/{id}/active-tools:
    get:
      summary: List active owner-created chat heartbeats for this box
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Active heartbeat timers; paused is true while the box is not running
          content:
            application/json:
              schema:
                type: object
                properties:
                  heartbeats:
                    type: array
                    items: {$ref: '#/components/schemas/ChatHeartbeat'}
        '403': {description: Owner access required}
        '404': {description: Box not found in this account}
  /v1/logical-boxes/{id}/heartbeats:
    post:
      summary: Start or replace an owner-created chat heartbeat
      description: Requires owner access. Each tick sends the exact message through normal user chat delivery. First tick is after the interval. Sleeping boxes pause without consuming ticks. A new key replaces the current timer; retrying the same key never resets it.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, intervalMinutes, message]
              properties:
                count: {type: integer, minimum: 1, maximum: 1000}
                intervalMinutes: {type: integer, minimum: 1, maximum: 1440}
                message: {type: string, minLength: 1, description: Nonblank ordinary chat text, at most 100000 UTF-8 bytes; /silent notes are not accepted}
      responses:
        '201':
          description: Persisted heartbeat or idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatHeartbeat'}
        '400': {description: Invalid parameters or conflicting idempotency key}
        '403': {description: Owner access required}
  /v1/logical-boxes/{id}/heartbeats/{heartbeat}:
    delete:
      summary: Stop this exact chat heartbeat
      description: Prevents future ticks. A message already queued may still be delivered. A stale timer ID never stops a replacement timer.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: heartbeat, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Stopped or already stopped}
        '403': {description: Owner access required}
        '404': {description: Box or heartbeat not found in this account}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: Owner/user token, or task service token only on /v1/tasks routes}
    desktopAgentAuth: {type: apiKey, in: header, name: Authorization, description: Private DesktopAgent credential issued to the assigned box}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    ProviderQuery: {name: provider, in: query, required: true, schema: {type: string}}
    ProviderCredentialQuery: {name: providerCredential, in: query, schema: {type: string}}
  schemas:
    ChatHeartbeat:
      type: object
      required: [id, count, intervalMinutes, message, remaining, nextAt, paused, active]
      properties:
        id: {type: string, format: uuid}
        count: {type: integer}
        intervalMinutes: {type: integer}
        message: {type: string}
        remaining: {type: integer}
        nextAt: {type: string, format: date-time}
        paused: {type: boolean}
        active: {type: boolean}
    ChatSidebarLayout:
      type: object
      required: [groups, members]
      properties:
        exists: {type: boolean, readOnly: true, description: Whether a layout has been saved for this account}
        groups:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, name, collapsed]
            properties:
              id: {type: string, maxLength: 64}
              name: {type: string, minLength: 1, maxLength: 48}
              collapsed: {type: boolean}
        members:
          type: object
          description: Maps box or pair conversation keys to a group ID
          additionalProperties: {type: string}
    LoginProfileRef:
      type: object
      required: [application, name]
      properties:
        application: {enum: [claude, codex, opencode, github]}
        name: {type: string}
        model: {type: string, maxLength: 200, description: Optional per-box model override}
        reasoningEffort: {type: string, description: Optional per-box reasoning choice paired with a model override}
    LoginProfile:
      allOf:
        - {$ref: '#/components/schemas/LoginProfileRef'}
        - type: object
          properties:
            createdAt: {type: string, format: date-time}
            model: {type: string, description: Non-secret model default read from the saved profile configuration}
            email: {type: string, format: email, description: Account email when present in a saved agent profile}
            host: {type: string, description: GitHub host for a saved GitHub profile}
            user: {type: string, description: GitHub account name for a saved GitHub profile}
    BrowserProfile:
      type: object
      required: [name, sourceBrowser, sourcePath, origins, createdAt, updatedAt]
      properties:
        name: {type: string}
        sourceBrowser: {enum: [chrome, chromium]}
        sourcePath: {type: string, description: Local path supplied during upload; owner metadata only}
        origins: {type: array, items: {type: string, format: uri}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BoxLoginProfiles:
      type: object
      required: [profiles, pending, verified]
      properties:
        profiles: {type: array, items: {$ref: '#/components/schemas/LoginProfileRef'}, description: References currently imported into the box}
        pending: {type: array, items: {$ref: '#/components/schemas/LoginProfileRef'}, description: Full selection queued for the next start}
        pendingSet: {type: boolean, description: Whether a queued selection exists, including an empty removal list}
        verified: {type: boolean, description: Whether the imported selection was explicitly recorded}
        applied: {type: boolean, description: Whether this PUT applied immediately to a running box}
        note: {type: string}
    ToolPreset:
      type: object
      required: [id, name, version, description]
      properties:
        id: {enum: [foundry, blender, desktop, tor-socks5, cloudflare-warp]}
        name: {type: string}
        version: {type: string}
        description: {type: string}
    FleetConfig:
      type: object
      required: [provider, compute_box_slots]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        compute_box_slots: {type: integer, minimum: 0, maximum: 32, default: 4}
        updatedAt: {type: string, format: date-time}
    BoxLimits:
      type: object
      required: [cpu, memoryMiB, swapMiB]
      properties:
        cpu: {type: number, description: CPUs in steps of cpuStep}
        memoryMiB: {type: integer, description: RAM in whole GiB}
        swapMiB: {type: integer, description: Swap in whole GiB}
    WorkerPool:
      type: object
      required: [provider, supported, desiredSlots]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        supported: {type: boolean}
        reason: {type: string, description: Why remote settings are unavailable}
        desiredSlots: {type: integer}
        worker:
          type: object
          properties:
            settings:
              type: object
              properties:
                revision: {type: integer}
                slots: {type: integer}
                boxDefaults: {$ref: '#/components/schemas/BoxLimits'}
            specs:
              type: object
              properties:
                cpus: {type: number}
                memoryBytes: {type: integer}
                swapBytes: {type: integer}
                diskTotalBytes: {type: integer}
                diskFreeBytes: {type: integer}
                isolationTier: {type: string}
            limits:
              type: object
              properties:
                minSlots: {type: integer}
                maxSlots: {type: integer, description: At most 32 and at most one slot per GiB of machine RAM}
                perBoxLimits: {type: boolean, description: Whether boxes get their own CPU and memory limits (container isolation)}
                boxMin: {$ref: '#/components/schemas/BoxLimits'}
                boxMax: {$ref: '#/components/schemas/BoxLimits'}
                cpuStep: {type: number}
                memoryStepMiB: {type: integer}
            slotsInUse: {type: integer}
            occupiedSlots: {type: integer}
            overcommitted: {type: boolean, description: Slots times default box memory exceeds machine RAM; allowed}
    SetWorkerPool:
      type: object
      required: [provider, revision, slots]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        revision: {type: integer}
        slots: {type: integer, minimum: 1}
        boxDefaults: {$ref: '#/components/schemas/BoxLimits'}
    FleetStatus:
      type: object
      required: [provider, desiredSlots, actualSlots, freeSlots, occupiedSlots, slots, detachedLogicalBoxes]
      properties:
        provider: {type: string}
        providerCredential: {type: string}
        desiredSlots: {type: integer}
        actualSlots: {type: integer}
        freeSlots: {type: integer}
        occupiedSlots: {type: integer}
        startingSlots: {type: integer}
        drainingSlots: {type: integer}
        unhealthySlots: {type: integer}
        stoppedSlots: {type: integer}
        pendingAllocationRequests: {type: integer}
        slots: {type: array, items: {$ref: '#/components/schemas/ComputeSlot'}}
        detachedLogicalBoxes: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}
    ComputeSlot:
      type: object
      properties:
        id: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        ordinal: {type: integer}
        state: {enum: [starting, free, reserved, occupied, draining, unhealthy, stopped]}
        serviceId: {type: string}
        serviceName: {type: string}
        deploymentInstanceId: {type: string}
        logicalBoxId: {type: string}
        logicalBoxName: {type: string}
        assignmentGeneration: {type: integer, format: int64}
        failureReason: {type: string}
    CreateLogicalBox:
      type: object
      required: [name, provider]
      properties:
        name: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        region: {type: string}
        defaultAgent: {enum: [shell, claude, codex, opencode]}
        roleIds: {type: array, items: {type: string, format: uuid}, description: Optional owner-only native role assignments.}
        loginProfiles:
          type: array
          maxItems: 2
          description: Owner-only selection of one agent profile and optionally one GitHub profile; an agent profile application also selects the box harness; omitted means no saved credentials provisioned
          items: {$ref: '#/components/schemas/LoginProfileRef'}
        diskGiB: {type: integer, format: int64, default: 10}
        desktopResolution: {enum: [1024x640, 1280x720], default: 1024x640, description: Desktop screen size selected at creation and retained across hibernation.}
        tools: {type: array, uniqueItems: true, items: {enum: [desktop, foundry, blender, tor-socks5, cloudflare-warp]}, description: Tor and Cloudflare WARP each start a local opt-in SOCKS5 proxy; choose at most one. WARP requires Cloudflare UDP connectivity.}
        volumeId: {type: string, description: Owner-only import; must be paired with volumeName.}
        volumeName: {type: string, description: Owner-only import; must be paired with volumeId.}
        allocateWhenReady: {type: boolean}
        allocationIdempotencyKey: {type: string}
    LogicalBox:
      type: object
      required: [id, name, provider, state, volumeId, volumeName, assignmentGeneration]
      properties:
        id: {type: string}
        name: {type: string}
        tools: {type: array, items: {type: string}}
        provider: {type: string}
        providerCredential: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/AgentRoleSummary'}}
        state: {enum: [detached, reserved, attaching, running, draining, hibernating, hibernated, deleting, failed]}
        volumeId: {type: string}
        volumeName: {type: string}
        slotId: {type: string}
        assignmentGeneration: {type: integer, format: int64}
        restorationState: {type: string}
        failureReason: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AgentRoleSummary:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    PutAgentRole:
      type: object
      required: [name, capabilities]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        description: {type: string, maxLength: 500}
        capabilities:
          type: object
          description: Typed capability grants. Names never authorize behavior.
          properties:
            allContacts:
              type: object
              properties: {enabled: {type: boolean}}
            mcpTools:
              type: object
              properties:
                enabled: {type: boolean}
                allowedTools: {type: array, items: {type: string}}
    AgentRole:
      allOf:
        - {$ref: '#/components/schemas/PutAgentRole'}
        - type: object
          required: [id, assignedBoxCount]
          properties:
            id: {type: string, format: uuid}
            assignedBoxCount: {type: integer, minimum: 0}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    PutRoleAssignments:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            type: object
            required: [boxId, roleIds]
            properties:
              boxId: {type: string, format: uuid}
              roleIds: {type: array, items: {type: string, format: uuid}}
    PutContactOverride:
      type: object
      required: [contact, state]
      properties:
        contact: {type: string, description: Target box name or id.}
        state: {enum: [inherit, allow, block]}
        twoWay: {type: boolean, default: false}
    SendBoxMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        submit: {type: boolean, default: true}
    BoxMessage:
      type: object
      properties:
        id: {type: string}
        taskId: {type: string}
        userId: {type: string}
        direction: {enum: [user_to_agent, agent_to_user]}
        text: {type: string}
        state: {enum: [queued, delivering, delivered, read, failed, ambiguous]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TerminalSnapshot:
      type: object
      properties:
        boxName: {type: string}
        session: {type: string}
        pane: {type: string}
        title: {type: string}
        command: {type: string}
        width: {type: integer}
        height: {type: integer}
        content: {type: string}
        capturedAt: {type: string, format: date-time}
        prompt:
          type: object
          description: A guarded numbered-choice prompt detected at the bottom of the live terminal.
          properties:
            id: {type: string, description: Stable prompt fingerprint for idempotent input.}
            text: {type: string}
            resumeInput: {type: boolean, description: The selected choice must be followed by a carriage return to submit text staged behind the prompt.}
            choices:
              type: array
              items:
                type: object
                properties:
                  value: {type: string}
                  label: {type: string}
                  input: {type: string, description: Safe exact terminal sequence generated by the controller.}
                  submit: {type: boolean, description: Whether the input endpoint should append Enter.}
    LogicalBoxConnection:
      type: object
      properties:
        logicalBoxId: {type: string}
        boxName: {type: string}
        session: {type: string}
        connection:
          type: object
          properties:
            transport: {enum: [openssh]}
            endpoint: {type: string}
            metadata: {type: object, additionalProperties: {type: string}}
    ConnectedBox:
      type: object
      required: [id, name, provider, state, management, chatCapable]
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        providerCredential: {type: string}
        state: {type: string}
        providerState: {type: string}
        region: {type: string}
        image: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
        storage: {type: object}
        management: {enum: [external]}
        chatCapable: {type: boolean, enum: [false]}
    BoxInventory:
      type: object
      required: [logicalBoxes, connectedBoxes]
      properties:
        logicalBoxes: {type: array, items: {$ref: '#/components/schemas/LogicalBox'}}
        connectedBoxes: {type: array, items: {$ref: '#/components/schemas/ConnectedBox'}}
    DirectBoxMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        agent: {enum: [claude, codex, opencode, shell], default: claude}
        session: {type: string, default: vmbox}
    ChatGroupMember:
      type: object
      required: [logicalBoxId]
      properties:
        logicalBoxId: {type: string}
        boxName: {type: string, readOnly: true}
        agent: {enum: [claude, codex, opencode, shell], default: claude}
        canReceive: {type: boolean, default: true}
    PutChatGroup:
      type: object
      required: [name, members]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        members: {type: array, minItems: 2, maxItems: 32, items: {$ref: '#/components/schemas/ChatGroupMember'}}
    ChatGroup:
      allOf:
        - {$ref: '#/components/schemas/PutChatGroup'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    SendGroupMessage:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 100000}
        recipientBoxIds: {type: array, items: {type: string}}
        sourceBoxId: {type: string, description: Optional group member whose output is being forwarded.}
    Resources:
      type: object
      properties:
        cpu: {type: number, exclusiveMinimum: 0}
        memoryMiB: {type: integer, minimum: 128}
        diskGiB: {type: integer, minimum: 1}
    Lifecycle:
      type: object
      properties:
        onSuccess: {enum: [delete, retain, stop], default: delete}
        onFailure: {enum: [delete, retain, stop], default: retain}
        maxTtl: {type: string, default: 8h}
        gracePeriod: {type: string, default: 5m}
    CreateRun:
      type: object
      required: [provider, command]
      properties:
        provider: {enum: [railway, docker, incus]}
        box: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
        region: {type: string}
        image: {type: string, description: OCI digest is recommended and recorded in box metadata.}
        components: {type: array, items: {type: string}}
        command:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
          description: Exact argv; no implicit shell interpolation.
        externalReference: {type: string}
        credentialReferences: {type: array, items: {type: string}, description: Opaque vault references, never secret values.}
        providerCredential: {type: string, description: Account-scoped encrypted provider credential name.}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        notificationPolicy: {type: string}
    Run:
      type: object
      required: [id, accountId, provider, state, request, createdAt, updatedAt]
      properties:
        id: {type: string}
        accountId: {type: string, format: uuid}
        boxId: {type: string}
        provider: {type: string}
        state: {enum: [queued, provisioning, preparing, running, needs_input, resuming, succeeded, failed, cancelled, cleaning_up, deleted, retained]}
        request: {$ref: '#/components/schemas/CreateRun'}
        exitCode: {type: integer}
        summary: {type: string}
        lastOutputAt: {type: string, format: date-time}
        lastHeartbeatAt: {type: string, format: date-time}
        lastActivity: {type: string, maxLength: 512}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [id, sequence, type, timestamp]
      properties:
        id: {type: string}
        sequence: {type: integer, minimum: 1}
        type: {enum: [state, output, heartbeat, progress, needs_input, resumed, success, failed, cleanup_requested]}
        state: {type: string}
        stream: {enum: [stdout, stderr]}
        message: {type: string, maxLength: 512}
        data: {type: object}
        timestamp: {type: string, format: date-time}
        signature: {type: string}
    Question:
      type: object
      required: [id, accountId, runId, prompt, state, blocking, askedAt]
      properties:
        id: {type: string}
        accountId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        prompt: {type: string}
        state: {enum: [open, answered, timed_out, cancelled]}
        blocking: {type: boolean}
        askedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        answer: {type: string}
        answeredBy: {type: string, format: uuid}
    CreateUser:
      type: object
      required: [subject, role]
      properties:
        subject: {type: string, minLength: 1}
        role: {enum: [owner, user]}
    PutSecret:
      type: object
      required: [secret]
      properties:
        secret: {type: object, writeOnly: true, minProperties: 1}
        config: {type: object, description: Non-secret provider configuration.}
    PutNotification:
      type: object
      required: [secret]
      properties:
        secret: {type: object, writeOnly: true, minProperties: 1}
        config: {type: object, description: Non-secret destination configuration.}
        allowedUsers: {type: array, items: {type: string}}
        allowedChats: {type: array, items: {type: string}, description: Discord guild/channel identifiers.}
        enabled: {type: boolean, default: true}
    TaskProfile:
      type: object
      required: [id, application, label]
      properties:
        id: {type: string, description: Random stable account-scoped ID}
        application: {enum: [codex, claude, opencode, github]}
        label: {type: string, description: Generated label without personal data}
    TaskProfileRef:
      type: object
      required: [profileId]
      properties:
        profileId: {type: string}
        model: {type: string}
        reasoningEffort: {type: string}
    TaskLinkRequest:
      type: object
      required: [kinds]
      properties:
        kinds: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {enum: [control, view, screenshot]}}
        ttlSeconds: {type: integer, minimum: 1, maximum: 604800, default: 86400}
    TaskLink:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [control, view, screenshot]}
        expiresAt: {type: string, format: date-time}
        url: {type: string, description: Secret URL present only when minted}
    AgentGoalTaskOptions:
      type: object
      required: [goal]
      properties:
        goal: {type: string, minLength: 1, maxLength: 100000}
        timeLimitSeconds: {type: integer, minimum: 300, maximum: 604800, default: 14400}
        retentionSeconds: {type: integer, minimum: 3600, maximum: 604800, default: 86400}
        links: {$ref: '#/components/schemas/TaskLinkRequest'}
    GoalTaskProfileSettings:
      type: object
      required: [agent]
      properties:
        agent: {enum: [codex, claude, opencode]}
        loginProfiles: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/TaskProfileRef'}}
        diskGiB: {type: integer, minimum: 1, maximum: 1000, default: 10}
        memoryGiB: {type: integer, minimum: 1}
        swapGiB: {type: integer, minimum: 0}
        desktopResolution: {enum: [1024x640, 1280x720], default: 1024x640}
        slotId: {type: string, format: uuid}
        tools: {type: array, items: {type: string}}
        instructions: {type: string}
        roleIds: {type: array, maxItems: 8, items: {type: string, format: uuid}}
        timeLimitSeconds: {type: integer, minimum: 300, maximum: 604800, default: 14400}
        retentionSeconds: {type: integer, minimum: 3600, maximum: 604800, default: 86400}
    SaveGoalTaskProfile:
      type: object
      required: [name, settings]
      properties:
        name: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-zA-Z0-9._-]+$'}
        settings: {$ref: '#/components/schemas/GoalTaskProfileSettings'}
    GoalTaskProfile:
      allOf:
        - {$ref: '#/components/schemas/SaveGoalTaskProfile'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    CreateGoalTask:
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/GoalTaskProfileSettings'}
            - {$ref: '#/components/schemas/AgentGoalTaskOptions'}
            - type: object
              required: [name]
              not: {required: [taskProfile]}
              properties:
                name: {type: string, minLength: 1, maxLength: 63}
        - type: object
          additionalProperties: false
          required: [name, goal, taskProfile]
          properties:
            name: {type: string, minLength: 1, maxLength: 63}
            goal: {type: string, minLength: 1, maxLength: 100000}
            taskProfile: {type: string, description: Task profile name or ID; settings are snapshotted at creation}
            links: {$ref: '#/components/schemas/TaskLinkRequest'}
    GoalTask:
      type: object
      required: [id, name, goal, state, box, creator, result, failure, createdAt, startedAt, finishedAt, deleteAt]
      properties:
        taskProfile: {type: string, description: Selected task profile name when created from a preset}
        id: {type: string, format: uuid}
        name: {type: string}
        goal: {type: string}
        state: {enum: [queued, starting, running, completed, failed, timed_out, abandoned, cancelled]}
        agent: {enum: [codex, claude, opencode]}
        queuePosition: {type: integer, description: Approximate account queue position; only present while queued}
        box: {type: [object, 'null'], properties: {id: {type: string}, name: {type: string}, state: {type: string}}}
        creator: {type: object, properties: {kind: {enum: [owner, user, service, box]}, id: {type: string}, name: {type: string}}}
        result: {type: [object, 'null'], properties: {text: {type: string}, files: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, mediaType: {type: string}, size: {type: integer}}}}}}
        failure: {type: [object, 'null'], properties: {message: {type: string}, reason: {enum: [agent, timeout, abandoned, cancelled, box_error]}}}
        timeLimitSeconds: {type: integer}
        retentionSeconds: {type: integer}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        deleteAt: {type: [string, 'null'], format: date-time}
        boxDeletedAt: {type: [string, 'null'], format: date-time}
        links: {type: array, items: {$ref: '#/components/schemas/TaskLink'}}
