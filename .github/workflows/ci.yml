name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', cache: true}
      - run: gofmt -d cmd internal | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: bash tests/run.sh
      - run: go build ./cmd/...
  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', cache: true}
      - run: docker build -t vmbox:e2e .
      - run: VMBOX_E2E_DOCKER=1 VMBOX_E2E_IMAGE=vmbox:e2e go test -v ./internal/provider/docker -run TestDockerE2E
      - run: VMBOX_E2E_IMAGE=vmbox:e2e bash tests/controller-e2e.sh
