name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile every package
        run: go test ./... -run '^$'
      - name: Vet
        run: go vet ./...
      - name: Test agent authorization and delivery boundaries
        run: >-
          go test ./internal/controller
          -run 'TestAgentBoxQuota|TestAgentEmailQuota|TestQueueAgentFollowup|TestReconcileAgentFollowup|TestTeamRolePreset|TestEffectiveAgent'
