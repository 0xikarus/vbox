name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile every package
        run: go test ./... -run '^$'
      - name: Vet
        run: go vet ./...
      - name: Verify bundled mascot model and held-out classification
        run: |
          go run ./cmd/mascot-train -check
          go test ./internal/controller -run 'TestClassifyMascotText|TestMascotModelHeldoutExamples|TestMascotObservationScopesSessionAndStoresOnlyState'
      - name: Verify bundled activity ranker and held-out agreement
        run: go run ./cmd/activity-train -check
      - name: Verify local activity generator export and Python parity
        run: go test ./internal/activityphrase -run 'TestGeneratorArtifactChecksum|TestGeneratorMatchesPythonExport' -count=1
      - name: Test agent authorization and delivery boundaries
        run: >-
          go test ./internal/controller
          -run 'TestAgentBoxQuota|TestAgentEmailQuota|TestQueueAgentFollowup|TestReconcileAgentFollowup|TestTeamRolePreset|TestEffectiveAgent'
