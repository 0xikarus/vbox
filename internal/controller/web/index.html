<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vmbox controller</title><link rel="stylesheet" href="/app.css">
<h1>Index of /controller</h1><p>Configure here. Work in your terminal: <code>vmbox BOX --session NAME</code>.</p>
<form id="login"><label>Controller token <input name="token" type="password" autocomplete="current-password" required></label><button>Log in</button></form>
<p id="error" role="alert"></p><main hidden id="app">
<nav><a href="#boxes">Boxes</a> · <a href="#providers">Providers</a> · <a href="#fleet">Capacity</a> · <a href="#notifications">Notifications</a> <button id="refresh">Refresh</button><button id="logout">Log out</button></nav>
<section id="boxes"><h2>Logical boxes</h2><div id="box-list"></div>
<form id="create"><label>Name <input name="name" required></label><label>Disk GiB <input name="disk" type="number" min="1" value="10"></label><button>Create persistent box</button></form></section>
<section id="providers" data-owner><h2>Providers</h2><div id="provider-list"></div>
<form id="provider"><label>Provider <input name="provider" required></label><label>Alias <input name="alias" required></label><label>Config JSON <textarea name="config">{}</textarea></label><label>Secret JSON (blank preserves existing secret) <textarea name="secret" autocomplete="off"></textarea></label><input name="revision" type="hidden"><button>Save</button><button type="reset">Reset</button></form>
<form id="default"><label>Default provider <input name="provider" required></label><label>Alias <input name="alias" required></label><button>Select default</button></form><pre id="schema"></pre></section>
<section id="fleet" data-owner><h2>Capacity</h2><pre id="capacity"></pre><form id="slots"><label>Compute slots <input name="count" type="number" min="0" required></label><button>Set capacity</button></form></section>
<section id="notifications" data-owner><h2>Notifications</h2><pre id="destinations"></pre>
<form id="notification"><label>Kind <select name="kind"><option>webhook</option><option>telegram</option><option>discord</option></select></label><label>Name <input name="name" required></label><label>Config JSON <textarea name="config">{}</textarea></label><label>Secret JSON <textarea name="secret" autocomplete="off" required></textarea></label><label>Allowed users (comma-separated) <input name="users"></label><label>Allowed chats (comma-separated) <input name="chats"></label><button>Save notification</button></form></section>
</main><script src="/app.js" defer></script></html>
