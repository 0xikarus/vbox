<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 250" role="img" aria-label="A little robot enters the vbox">
  <title>A little robot enters the vbox</title>
  <style>
    .robot{animation:enter 3.8s cubic-bezier(.22,.72,.22,1) infinite}
    .disk{animation:insert 3.8s ease-in-out infinite}
    .shadow{animation:breathe 3.8s ease-in-out infinite}
    .eye{animation:blink 3.8s linear infinite}
    .lamp{animation:glow 3.8s ease-in-out infinite}
    @keyframes enter{
      0%,7%{transform:translateY(-64px);opacity:0}
      12%{opacity:1}
      52%{transform:translateY(3px);opacity:1}
      62%,86%{transform:translateY(0);opacity:1}
      94%,100%{transform:translateY(-64px);opacity:0}
    }
    @keyframes insert{
      0%,27%{transform:translateX(-26px);opacity:0}
      45%,87%{transform:translateX(0);opacity:1}
      95%,100%{transform:translateX(-26px);opacity:0}
    }
    @keyframes breathe{0%,100%{transform:scaleX(.82);opacity:.18}55%{transform:scaleX(1);opacity:.3}}
    @keyframes blink{0%,68%,72%,100%{transform:scaleY(1)}70%{transform:scaleY(.16)}}
    @keyframes glow{0%,35%,100%{opacity:.35}58%,82%{opacity:1}}
    .word{fill:#f3efe4;stroke:#1b2a41;stroke-width:2;paint-order:stroke}
    @media (prefers-reduced-motion: reduce){.robot,.disk,.shadow,.eye,.lamp{animation:none}}
  </style>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253c60"/><stop offset="1" stop-color="#14253f"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30496e"/><stop offset="1" stop-color="#1b2a41"/></linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6f1e4"/><stop offset="1" stop-color="#ced9d2"/></linearGradient>
  </defs>

  <ellipse class="shadow" cx="124" cy="207" rx="94" ry="14" fill="#0b1528"/>
  <path d="M44 86 124 40 204 86 124 133Z" fill="#213756" stroke="#14243e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M57 85 124 50 191 85 124 119Z" fill="url(#cavity)"/>
  <path d="M57 85 124 119 124 135 44 93Z" fill="#b8c7c1" opacity=".55"/>
  <path d="M124 119 191 85 204 93 124 135Z" fill="#dbe3dc" opacity=".8"/>
  <g transform="translate(150 81)">
    <path d="M0-10 24-18 25 10 2 18Z" fill="#1b2a41" stroke="#344b68" stroke-width="2"/>
    <path d="M5-6 20-11 20 7 5 12Z" fill="#314969"/>
    <circle cx="10" cy="1" r="2" fill="#42dfbd"/><circle cx="16" cy="-1" r="2" fill="#42dfbd"/>
    <path d="m2 18 23-8 10 6-23 9Z" fill="#1b2a41"/>
    <path d="m13 18 12-4" stroke="#42dfbd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="robot">
    <path d="M124 75V67" stroke="#d8ccb0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="64" r="4" fill="#ff6f59"/>
    <path d="M106 119q-9 8-4 20l10 6 5-12M142 119q9 8 4 20l-10 6-5-12" fill="#efe7cf" stroke="#d6c9ac" stroke-width="2.5"/>
    <rect x="108" y="115" width="32" height="32" rx="12" fill="#f3efe4" stroke="#d6c9ac" stroke-width="2.5"/>
    <path d="M113 132h22" stroke="#d9cfba" stroke-width="3" stroke-linecap="round"/>
    <circle cx="96" cy="96" r="9" fill="#f3efe4" stroke="#d6c9ac" stroke-width="2.5"/>
    <circle cx="152" cy="96" r="9" fill="#f3efe4" stroke="#d6c9ac" stroke-width="2.5"/>
    <rect x="97" y="75" width="54" height="43" rx="16" fill="#f3efe4" stroke="#d6c9ac" stroke-width="2.5"/>
    <rect x="105" y="84" width="38" height="28" rx="10" fill="#1b2a41"/>
    <g class="eye" style="transform-origin:116px 98px"><ellipse cx="116" cy="98" rx="2.8" ry="5" fill="#42dfbd"/><ellipse cx="133" cy="98" rx="2.8" ry="5" fill="#42dfbd"/></g>
  </g>

  <path d="M44 86 124 133 124 208 44 163Z" fill="url(#left)" stroke="#14243e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M124 133 204 86 204 163 124 208Z" fill="url(#right)" stroke="#14243e" stroke-width="4" stroke-linejoin="round"/>
  <path d="m44 86 80 47 80-47" fill="none" stroke="#3b5274" stroke-width="5" stroke-linejoin="round"/>
  <path d="M58 124 102 148 102 172 58 147Z" fill="#172841" stroke="#364d6c" stroke-width="2"/>
  <path d="m67 136 23 13" stroke="#344965" stroke-width="4" stroke-linecap="round"/>
  <circle class="lamp" cx="95" cy="157" r="3" fill="#42dfbd"/>
  <path d="M58 153 102 177 102 196 58 171Z" fill="#172841" stroke="#364d6c" stroke-width="2"/>
  <circle cx="95" cy="183" r="3" fill="#ffcb55"/>
  <path d="m145 150 38-22v31l-38 22Z" fill="#223553" opacity=".56"/>

  <g class="disk">
    <path d="m20 151 43-20 36 20-43 22Z" fill="#ff6f59" stroke="#cf574e" stroke-width="2" stroke-linejoin="round"/>
    <path d="m20 151 36 22v8l-36-22Z" fill="#df6256"/>
    <path d="m56 173 43-22v8l-43 22Z" fill="#d4534d"/>
    <ellipse cx="60" cy="151" rx="10" ry="5" fill="#e35750"/>
    <ellipse cx="60" cy="151" rx="5" ry="2.5" fill="#ff9a78"/>
  </g>

  <text x="44" y="243" fill="#ff6f59" font-family="system-ui,sans-serif" font-size="35" font-weight="850" letter-spacing="-2">v</text>
  <text class="word" x="66" y="243" font-family="system-ui,sans-serif" font-size="35" font-weight="850" letter-spacing="-2">box</text>
</svg>
