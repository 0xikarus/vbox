# vmbox managed tmux configuration -- QWERTZ-friendly, terminal-safe defaults.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g history-limit 200000
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
# Export explicit tmux copies, but do not let pane applications replace buffers.
set -g set-clipboard external
set -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard"
set -as terminal-overrides ",xterm*:Tc"
setw -g mode-keys emacs

bind d detach-client
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r M-Up resize-pane -U 2
bind -r M-Down resize-pane -D 2
bind -r M-Left resize-pane -L 2
bind -r M-Right resize-pane -R 2
bind -T copy-mode PageUp send-keys -X page-up
bind -T copy-mode PageDown send-keys -X page-down
bind s copy-mode
bind PageUp copy-mode -u
bind h display-popup -E -w 84% -h 84% -T " vmbox help " "vmbox-runtime tmux-help; printf '\nPress Enter to close help...'; read answer"
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode C-f command-prompt -p "Search forward:" "send-keys -X search-forward '%%'"
bind -T copy-mode Space send-keys -X begin-selection
bind -T copy-mode Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# -p preserves bracketed paste when the application requests it (multiline safety).
bind v paste-buffer -p

set -g status on
set -g status-position bottom
set -g status 2
set -g status-interval 1
set -g status-style "bg=colour22,fg=colour231"
set -g message-style "bg=colour24,fg=colour231"
set -g mode-style "bg=colour24,fg=colour231"
set -g status-format[0] "#{?#{<:#{client_width},120},#[bold]BOX #{VMBOX_NAME} | SLOT #{VMBOX_COMPUTE_SLOT} | #S#[align=right]#[nobold]%H:%M ,#[align=left]#[bold] BOX: #{VMBOX_NAME} | SLOT: #{VMBOX_COMPUTE_SLOT} | SESSION: #S | STATE: #{VMBOX_ASSIGNMENT_STATE} | NET: #{VMBOX_CONNECTION_HEALTH}#[align=right]#[nobold] %H:%M }"
set -g status-format[1] "#{?#{<:#{client_width},100},#{?pane_in_mode,SCROLL | WRITE: q/Esc | HELP: Ctrl-a h,WRITE | SCROLL: Ctrl-a s | DETACH: Ctrl-a d | HELP: Ctrl-a h},#{?pane_in_mode,#[bold]MODE: SCROLL#[nobold] | MOVE: arrows/PgUp/PgDn | SEARCH: Ctrl-f | COPY: Space/Enter | WRITE: q or Esc | HELP: Ctrl-a h,#[bold]MODE: WRITE#[nobold] | SCROLL: Ctrl-a s or mouse wheel | DETACH: Ctrl-a d | HELP: Ctrl-a h}}"
