# Private files live outside the checkout under /opt/vbox-controller.
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - path: /opt/vbox-controller/database.env
        format: raw
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=100, -c, work_mem=4MB]
    volumes:
      - postgres:/var/lib/postgresql
    networks: [database]
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logs
      driver: local
      options: {max-size: 10m, max-file: "3"}
  controller:
    image: vbox-controller:${DEPLOY_TAG:?Set DEPLOY_TAG to the tested commit}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file:
      - path: /opt/vbox-controller/controller.env
        format: raw
    ports: ["127.0.0.1:43120:8080"]
    networks:
      database:
      edge:
        aliases: [vbox-controller]
    cpus: 0.5
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 512
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    logging: *logs
volumes:
  postgres:
networks:
  database: {internal: true}
  edge: {external: true}
